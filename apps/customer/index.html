<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Order anything in Qatar</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="../shared/app.css">
<style>
  .app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
  .top{position:sticky;top:0;background:var(--paper);z-index:5;padding:14px 16px 8px;border-bottom:1px solid var(--line)}
  .addr{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
  .addr small{color:var(--slate);font-weight:500}
  .verts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px}
  .vert{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center;font-weight:700;font-size:13px}
  .vert.on{border-color:var(--maroon);background:var(--maroon-soft);color:var(--maroon)}
  .vert i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
  .search{padding:0 16px 10px}
  .search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .store{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff;cursor:pointer}
  .store .img{width:76px;height:76px;border-radius:10px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
  .store b{font-size:15px}
  .store .m{font-size:13px;color:var(--slate)}
  .store.closed{opacity:.55}
  .prod{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:#fff}
  .prod .p{font-weight:700;color:var(--maroon)}
  .qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .qty button{width:32px;height:32px;font-weight:800}
  .qty span{min-width:28px;text-align:center;font-weight:700}
  .cartbar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:transparent;z-index:6}
  .cartbar .btn{max-width:528px;margin:0 auto;justify-content:space-between}
  .nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
  .nav button{flex:1;padding:10px 4px;font-size:12px;font-weight:700;color:var(--slate)}
  .nav button.on{color:var(--maroon)}
  .nav i{display:block;font-style:normal;font-size:20px}
  #map{height:240px;border-radius:12px;border:1px solid var(--line);margin:12px 0}
  .fees div{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}
  .fees .tot{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
  .pay{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .pay button{padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-weight:700}
  .pay button.on{border-color:var(--maroon);background:var(--maroon-soft);color:var(--maroon)}
  .tl{list-style:none;padding:0;margin:12px 0}
  .tl li{display:flex;gap:10px;padding:6px 0;font-size:14px;color:var(--slate)}
  .tl li::before{content:'';width:10px;height:10px;border-radius:50%;background:var(--line);margin-top:6px;flex:none}
  .tl li.done{color:var(--ink)}.tl li.done::before{background:var(--maroon)}
  .back{font-weight:700;color:var(--maroon);padding:12px 16px;display:inline-block}
  .section{padding:0 16px}
</style>
</head>
<body><div id="root" class="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="../shared/app.js"></script>
<script>
const root = document.getElementById('root');
const VERTS = [['food', '🍔', 'Food', 'مطاعم'], ['grocery', '🥬', 'Grocery', 'بقالة'], ['pharmacy', '💊', 'Pharmacy', 'صيدلية'], ['parcel', '📦', 'Parcel', 'طرود']];
const ICON = { food: '🍔', grocery: '🥬', pharmacy: '💊' };
let state = { vertical: 'food', addr: JSON.parse(localStorage.getItem('addr') || 'null'), cart: JSON.parse(localStorage.getItem('cart') || '{"store":null,"items":[]}'), tab: 'home', search: '' };
const saveCart = () => localStorage.setItem('cart', JSON.stringify(state.cart));
let socket;

async function boot() {
  if (!S.token) await renderLogin(root, { title: t('Order anything in Qatar', 'اطلب أي شيء في قطر'), subtitle: t('Food, groceries, pharmacy and parcels, delivered by our own riders.', 'مطاعم وبقالة وصيدلية وطرود، يوصلها مندوبونا.') });
  socket = connectSocket({ 'order:update': o => { if (state.tab === 'track' && state.trackId === o.id) loadTrack(o.id); }, 'rider:location': p => { if (state.trackId === p.order_id && riderMarker) riderMarker.setLatLng([p.lat, p.lng]); } });
  if (!state.addr) return pickAddress();
  home();
}

// ---------- Address ----------
let pickMap, pickMarker;
function pickAddress() {
  state.tab = 'addr';
  root.innerHTML = `<div class="top"><h1 class="h1">${t('Where should we deliver?', 'أين نوصل طلبك؟')}</h1><p class="muted">${t('Drag the pin to your door.', 'اسحب الدبوس إلى بابك.')}</p></div>
    <div class="section"><div id="map"></div>
    <div class="field"><label>${t('Building, villa, street', 'المبنى، الفيلا، الشارع')}</label><input id="line" value="${state.addr ? state.addr.line || '' : ''}"></div>
    <div class="field"><label>${t('Notes for the rider', 'ملاحظات للمندوب')}</label><input id="notes" value="${state.addr ? state.addr.notes || '' : ''}"></div>
    <p class="muted" id="zone"></p><button class="btn block" id="save">${t('Deliver here', 'التوصيل هنا')}</button>
    <button class="btn ghost block" style="margin-top:8px" id="loc">📍 ${t('Use my location', 'استخدم موقعي')}</button></div>`;
  const start = state.addr ? [state.addr.lat, state.addr.lng] : [25.2854, 51.5310];
  pickMap = L.map('map').setView(start, 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(pickMap);
  pickMarker = L.marker(start, { draggable: true }).addTo(pickMap);
  const check = async () => { const p = pickMarker.getLatLng(); const r = await api(`/catalog/zones/check?lat=${p.lat}&lng=${p.lng}`); document.getElementById('zone').textContent = r.deliverable ? `${t('Delivery zone', 'منطقة التوصيل')}: ${r.zone.name}` : t('Sorry, we do not deliver here yet.', 'عذراً، لا نوصل إلى هنا بعد.'); return r.deliverable; };
  pickMarker.on('dragend', check); pickMap.on('click', e => { pickMarker.setLatLng(e.latlng); check(); }); check();
  document.getElementById('loc').onclick = () => navigator.geolocation && navigator.geolocation.getCurrentPosition(p => { pickMarker.setLatLng([p.coords.latitude, p.coords.longitude]); pickMap.setView([p.coords.latitude, p.coords.longitude], 16); check(); }, () => toast(t('Location unavailable', 'الموقع غير متاح'), true));
  document.getElementById('save').onclick = async () => {
    if (!(await check())) return toast(t('Address is outside our delivery zones', 'العنوان خارج مناطق التوصيل'), true);
    const p = pickMarker.getLatLng(); state.addr = { lat: p.lat, lng: p.lng, line: document.getElementById('line').value, notes: document.getElementById('notes').value };
    localStorage.setItem('addr', JSON.stringify(state.addr)); home();
  };
}

// ---------- Home ----------
function shell(inner, tab) {
  state.tab = tab;
  root.innerHTML = inner + `<nav class="nav">
    <button class="${tab === 'home' ? 'on' : ''}" onclick="home()"><i>🏠</i>${t('Home', 'الرئيسية')}</button>
    <button class="${tab === 'orders' ? 'on' : ''}" onclick="ordersPage()"><i>🧾</i>${t('Orders', 'طلباتي')}</button>
    <button class="${tab === 'account' ? 'on' : ''}" onclick="accountPage()"><i>👤</i>${t('Account', 'حسابي')}</button></nav>`;
}
async function home() {
  shell(`<div class="top"><div class="row between"><div class="addr" onclick="pickAddress()">📍 <span>${state.addr.line || t('Set address', 'حدد العنوان')}<br><small>${t('Tap to change', 'اضغط للتغيير')}</small></span></div><button class="pill" onclick="setLang(S.lang==='ar'?'en':'ar');home()">${S.lang === 'ar' ? 'EN' : 'ع'}</button></div></div>
    <div class="verts">${VERTS.map(([k, i, en, ar]) => `<div class="vert ${state.vertical === k ? 'on' : ''}" onclick="state.vertical='${k}';home()"><i>${i}</i>${t(en, ar)}</div>`).join('')}</div>
    ${state.vertical === 'parcel' ? '' : `<div class="search"><input id="q" placeholder="${t('Search stores and items', 'ابحث عن متاجر ومنتجات')}" value="${state.search}"></div>`}
    <div id="list"><div class="spin"></div></div>`, 'home');
  if (state.vertical === 'parcel') return parcelForm();
  const q = document.getElementById('q'); let tm; q.oninput = () => { clearTimeout(tm); tm = setTimeout(() => { state.search = q.value; loadStores(); }, 300); };
  loadStores();
}
async function loadStores() {
  const r = await api(`/catalog/stores?vertical=${state.vertical}&lat=${state.addr.lat}&lng=${state.addr.lng}&search=${encodeURIComponent(state.search)}`);
  const list = document.getElementById('list'); if (!list) return;
  list.innerHTML = r.stores.length ? r.stores.map(s => `<div class="store ${s.status !== 'open' ? 'closed' : ''}" onclick="openStore(${s.id})"><div class="img">${ICON[s.vertical]}</div><div style="flex:1">
      <div class="row between"><b>${S.lang === 'ar' && s.name_ar ? s.name_ar : s.name_en}</b>${s.featured ? '<span class="pill maroon">' + t('Featured', 'مميز') + '</span>' : ''}</div>
      <div class="m">⭐ ${Number(s.rating).toFixed(1)} · ${s.km} km · ${s.eta_min} ${t('min', 'دقيقة')}</div>
      <div class="m">${s.status === 'open' ? `${t('Delivery', 'التوصيل')} ${fmt(s.delivery_fee)}` : `<span class="pill warn">${s.status === 'busy' ? t('Busy', 'مشغول') : t('Closed', 'مغلق')}</span>`}</div></div></div>`).join('')
    : `<div class="empty">${t('No stores in your zone for this category yet.', 'لا توجد متاجر في منطقتك لهذه الفئة بعد.')}</div>`;
}

// ---------- Store ----------
let store;
async function openStore(id) {
  store = await api('/catalog/stores/' + id);
  if (state.cart.store && state.cart.store.id !== id && state.cart.items.length) { if (!confirm(t('Start a new cart? Items from the other store will be removed.', 'بدء سلة جديدة؟ سيتم حذف عناصر المتجر الآخر.'))) return; state.cart = { store: null, items: [] }; }
  const byCat = {}; store.products.forEach(p => (byCat[p.category_id] = byCat[p.category_id] || []).push(p));
  shell(`<a class="back" onclick="home()">‹ ${t('Back', 'رجوع')}</a>
    <div class="section"><h1 class="h1">${S.lang === 'ar' && store.name_ar ? store.name_ar : store.name_en}</h1><p class="muted">${store.address || ''} · ⭐ ${Number(store.rating).toFixed(1)} · ${store.prep_time_min} ${t('min prep', 'دقيقة تحضير')}</p></div>
    ${store.categories.map(c => `<h2 class="h2 section" style="margin-top:18px">${S.lang === 'ar' && c.name_ar ? c.name_ar : c.name_en}</h2>${(byCat[c.id] || []).map(prodRow).join('')}`).join('')}
    ${(byCat['null'] || byCat[null] || []).map(prodRow).join('')}
    <div style="height:80px"></div>`, 'home');
  drawCartBar();
}
function prodRow(p) {
  const inCart = state.cart.items.find(i => i.product_id === p.id); const out = p.stock !== null && p.stock <= 0;
  return `<div class="prod" id="p${p.id}"><div><b>${S.lang === 'ar' && p.name_ar ? p.name_ar : p.name_en}</b>${p.requires_approval ? ' <span class="pill warn">' + t('Prescription', 'وصفة طبية') + '</span>' : ''}<div class="muted">${p.description || ''}${p.unit !== 'each' ? ' · ' + t('per', 'لكل') + ' ' + p.unit : ''}</div><div class="p">${fmt(p.price)}</div></div>
    <div>${out ? `<span class="pill">${t('Out of stock', 'غير متوفر')}</span>` : `<div class="qty"><button onclick="addItem(${p.id},-1)">−</button><span>${inCart ? inCart.qty : 0}</span><button onclick="addItem(${p.id},1)">+</button></div>`}</div></div>`;
}
function addItem(pid, d) {
  const p = store.products.find(x => x.id === pid);
  state.cart.store = { id: store.id, name: store.name_en, vertical: store.vertical };
  let it = state.cart.items.find(i => i.product_id === pid);
  if (!it && d > 0) { it = { product_id: pid, qty: 0, name: p.name_en, price: Number(p.price), requires_approval: p.requires_approval }; state.cart.items.push(it); }
  if (it) { it.qty += d; if (it.qty <= 0) state.cart.items = state.cart.items.filter(i => i !== it); }
  saveCart(); document.getElementById('p' + pid).outerHTML = prodRow(p); drawCartBar();
}
function drawCartBar() {
  document.querySelectorAll('.cartbar').forEach(e => e.remove());
  const n = state.cart.items.reduce((s, i) => s + i.qty, 0); if (!n) return;
  const total = state.cart.items.reduce((s, i) => s + i.qty * i.price, 0);
  const bar = document.createElement('div'); bar.className = 'cartbar'; bar.innerHTML = `<button class="btn block" onclick="checkout()"><span>${n} ${t('items', 'عناصر')}</span><span>${t('View cart', 'عرض السلة')} · ${fmt(total)}</span></button>`;
  document.body.appendChild(bar);
}

// ---------- Checkout ----------
let quote, pay = 'cod', promo = '', rxUrl = '';
async function checkout() {
  document.querySelectorAll('.cartbar').forEach(e => e.remove());
  const rx = state.cart.items.some(i => i.requires_approval);
  shell(`<a class="back" onclick="openStore(${state.cart.store.id})">‹ ${state.cart.store.name}</a>
    <div class="section"><h1 class="h1">${t('Checkout', 'إتمام الطلب')}</h1>
    <div class="card">${state.cart.items.map(i => `<div class="row between"><span>${i.qty} × ${i.name}</span><b>${fmt(i.qty * i.price)}</b></div>`).join('')}</div>
    <h2 class="h2" style="margin-top:16px">${t('Deliver to', 'التوصيل إلى')}</h2><div class="card row between"><span>📍 ${state.addr.line || ''}</span><button class="btn sm ghost" onclick="pickAddress()">${t('Change', 'تغيير')}</button></div>
    ${rx ? `<h2 class="h2" style="margin-top:16px">${t('Prescription', 'الوصفة الطبية')}</h2><div class="card"><p class="muted">${t('One or more items need a prescription. The pharmacy will review it before preparing your order.', 'تحتاج بعض العناصر لوصفة طبية. ستراجعها الصيدلية قبل تحضير طلبك.')}</p><input type="file" accept="image/*" id="rx"></div>` : ''}
    <h2 class="h2" style="margin-top:16px">${t('Payment', 'الدفع')}</h2><div class="pay"><button class="on" id="pcod" onclick="setPay('cod')">💵 ${t('Cash', 'نقداً')}</button><button id="pcard" onclick="setPay('card')">💳 ${t('Card', 'بطاقة')}</button><button id="pwallet" onclick="setPay('wallet')">👛 ${t('Wallet', 'المحفظة')}</button></div>
    <div class="field" style="margin-top:14px"><label>${t('Promo code', 'رمز الخصم')}</label><div class="row"><input id="promo" placeholder="WELCOME20" style="flex:1"><button class="btn ghost" onclick="applyPromo()">${t('Apply', 'تطبيق')}</button></div></div>
    <div class="field"><label>${t('Order notes', 'ملاحظات')}</label><input id="notes"></div>
    <div class="card fees" id="fees"><div class="spin"></div></div>
    <button class="btn block" style="margin-top:14px" id="place">${t('Place order', 'تأكيد الطلب')}</button></div>`, 'home');
  pay = 'cod'; promo = '';
  const rxi = document.getElementById('rx'); if (rxi) rxi.onchange = () => { const f = rxi.files[0]; const r = new FileReader(); r.onload = () => rxUrl = r.result.slice(0, 200000); r.readAsDataURL(f); };
  document.getElementById('place').onclick = placeOrder;
  loadQuote();
}
function setPay(p) { pay = p; ['cod', 'card', 'wallet'].forEach(k => document.getElementById('p' + k).classList.toggle('on', k === p)); }
function applyPromo() { promo = document.getElementById('promo').value.trim(); loadQuote(); }
async function loadQuote() {
  try {
    quote = await api('/orders/quote', { method: 'POST', body: { store_id: state.cart.store.id, items: state.cart.items.map(i => ({ product_id: i.product_id, qty: i.qty })), dropoff: state.addr, promo_code: promo || undefined } });
    document.getElementById('fees').innerHTML = `<div><span>${t('Subtotal', 'المجموع')}</span><span>${fmt(quote.subtotal)}</span></div><div><span>${t('Delivery', 'التوصيل')} (${quote.km} km)</span><span>${fmt(quote.delivery_fee)}</span></div><div><span>${t('Service fee', 'رسوم الخدمة')}</span><span>${fmt(quote.service_fee)}</span></div>${quote.discount > 0 ? `<div style="color:var(--ok)"><span>${t('Discount', 'الخصم')} ${quote.promo_code}</span><span>−${fmt(quote.discount)}</span></div>` : ''}<div class="tot"><span>${t('Total', 'الإجمالي')}</span><span>${fmt(quote.total)}</span></div>`;
  } catch (e) { toast(e.message, true); if (promo) { promo = ''; loadQuote(); } }
}
async function placeOrder() {
  const btn = document.getElementById('place'); btn.disabled = true;
  try {
    const o = await api('/orders', { method: 'POST', body: { store_id: state.cart.store.id, items: state.cart.items.map(i => ({ product_id: i.product_id, qty: i.qty })), dropoff: { ...state.addr, phone: S.user.phone, name: S.user.name }, promo_code: promo || undefined, payment_method: pay, notes: document.getElementById('notes').value, prescription_url: rxUrl || undefined } });
    state.cart = { store: null, items: [] }; saveCart(); toast(t('Order placed', 'تم تأكيد الطلب')); track(o.id);
  } catch (e) { toast(e.message, true); btn.disabled = false; }
}

// ---------- Parcel ----------
let pMap, pickM, dropM;
function parcelForm() {
  document.getElementById('list').innerHTML = `<div class="section"><p class="muted">${t('Send anything across Doha. Drag the two pins, then tell us what it is.', 'أرسل أي شيء داخل الدوحة. اسحب الدبوسين ثم أخبرنا بالمحتوى.')}</p>
    <div id="map"></div>
    <div class="field"><label>${t('Pickup details', 'تفاصيل الاستلام')}</label><input id="pl" placeholder="${t('Building, contact name', 'المبنى، اسم المرسل')}"></div>
    <div class="field"><label>${t('Receiver name and phone', 'اسم المستلم ورقمه')}</label><input id="rn"></div>
    <div class="field"><label>${t('What is being sent?', 'ما الذي يتم إرساله؟')}</label><input id="what"></div>
    <div class="field"><label>${t('Cash to collect from receiver (optional)', 'مبلغ يُحصّل من المستلم (اختياري)')}</label><input id="cod" type="number" min="0" placeholder="0"></div>
    <div class="card fees" id="fees"></div><button class="btn block" style="margin-top:12px" id="send">${t('Request pickup', 'طلب استلام')}</button></div>`;
  pMap = L.map('map').setView([state.addr.lat, state.addr.lng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(pMap);
  pickM = L.marker([state.addr.lat + 0.01, state.addr.lng - 0.01], { draggable: true, title: 'Pickup' }).addTo(pMap).bindTooltip(t('Pickup', 'استلام'), { permanent: true, direction: 'top' });
  dropM = L.marker([state.addr.lat, state.addr.lng], { draggable: true }).addTo(pMap).bindTooltip(t('Drop-off', 'تسليم'), { permanent: true, direction: 'top' });
  const q = async () => { try { const r = await api('/orders/quote', { method: 'POST', body: { type: 'parcel', pickup: pickM.getLatLng(), dropoff: dropM.getLatLng() } }); document.getElementById('fees').innerHTML = `<div class="tot"><span>${t('Delivery fee', 'رسوم التوصيل')}</span><span>${fmt(r.total)}</span></div>`; } catch (e) { document.getElementById('fees').innerHTML = `<p class="muted">${e.message}</p>`; } };
  pickM.on('dragend', q); dropM.on('dragend', q); q();
  document.getElementById('send').onclick = async () => {
    try {
      const p = pickM.getLatLng(), d = dropM.getLatLng();
      const o = await api('/orders', { method: 'POST', body: { type: 'parcel', pickup: { lat: p.lat, lng: p.lng, line: document.getElementById('pl').value, phone: S.user.phone }, dropoff: { lat: d.lat, lng: d.lng, line: document.getElementById('rn').value, phone: S.user.phone }, notes: document.getElementById('what').value, cod_collect: Number(document.getElementById('cod').value || 0) } });
      toast(t('Pickup requested', 'تم طلب الاستلام')); track(o.id);
    } catch (e) { toast(e.message, true); }
  };
}

// ---------- Orders & tracking ----------
async function ordersPage() {
  shell(`<div class="top"><h1 class="h1">${t('My orders', 'طلباتي')}</h1></div><div id="list"><div class="spin"></div></div>`, 'orders');
  const os = await api('/orders/mine');
  document.getElementById('list').innerHTML = os.length ? os.map(o => `<div class="store" onclick="track(${o.id})"><div class="img">${ICON[o.vertical] || '📦'}</div><div style="flex:1"><div class="row between"><b>${o.store_name || t('Parcel', 'طرد')}</b><span class="pill ${pillClass(o.status)}">${statusLabel(o.status)}</span></div><div class="m">${o.code} · ${fmt(o.total)} · ${ago(o.created_at)}</div></div></div>`).join('') : `<div class="empty">${t('No orders yet.', 'لا توجد طلبات بعد.')}</div>`;
}
let trackMap, riderMarker;
const STEPS = ['placed', 'accepted', 'preparing', 'ready', 'picked_up', 'delivered'];
async function track(id) { state.trackId = id; socket && socket.emit('watch', id); shell(`<a class="back" onclick="ordersPage()">‹ ${t('Orders', 'طلباتي')}</a><div class="section" id="tr"><div class="spin"></div></div>`, 'track'); state.tab = 'track'; loadTrack(id); }
async function loadTrack(id) {
  const o = await api('/orders/' + id);
  const el = document.getElementById('tr'); if (!el) return;
  const idx = STEPS.indexOf(o.status); const bad = ['cancelled', 'refunded'].includes(o.status);
  const canCancel = ['placed', 'awaiting_approval'].includes(o.status);
  el.innerHTML = `<div class="row between"><h1 class="h1">${o.store_name || t('Parcel', 'طرد')}</h1><span class="pill ${pillClass(o.status)}">${statusLabel(o.status)}</span></div><p class="muted">${o.code} · ${new Date(o.created_at).toLocaleString()}</p>
    ${bad ? '' : `<div class="stepper">${STEPS.slice(0, 6).map((s, i) => `<span class="${i <= idx ? 'done' : ''}"></span>`).join('')}</div>`}
    ${o.status === 'awaiting_approval' ? `<div class="card" style="background:var(--warn-soft);border-color:transparent">${t('The pharmacy is reviewing your prescription.', 'تراجع الصيدلية وصفتك الطبية.')}</div>` : ''}
    ${['ready', 'picked_up'].includes(o.status) && o.rider_name ? `<div class="card row between"><span>🛵 ${o.rider_name}<br><span class="muted">${o.status === 'picked_up' ? t('On the way to you', 'في الطريق إليك') : t('Heading to the store', 'متجه إلى المتجر')}</span></span><a class="btn sm" href="tel:${o.rider_phone}">${t('Call', 'اتصال')}</a></div>` : ''}
    <div id="map"></div>
    <ul class="tl">${o.events.map(e => `<li class="done"><span><b>${statusLabel(e.status)}</b> · ${new Date(e.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${e.note ? ' · ' + e.note : ''}</span></li>`).join('')}</ul>
    <div class="card fees">${o.items.map(i => `<div><span>${i.qty} × ${i.name}</span><span>${fmt(i.line_total)}</span></div>`).join('')}<div><span>${t('Delivery', 'التوصيل')}</span><span>${fmt(o.delivery_fee)}</span></div><div><span>${t('Service fee', 'رسوم الخدمة')}</span><span>${fmt(o.service_fee)}</span></div>${Number(o.discount) > 0 ? `<div><span>${t('Discount', 'الخصم')}</span><span>−${fmt(o.discount)}</span></div>` : ''}<div class="tot"><span>${t('Total', 'الإجمالي')} · ${o.payment_method.toUpperCase()}</span><span>${fmt(o.total)}</span></div></div>
    ${canCancel ? `<button class="btn ghost block" style="margin-top:12px" onclick="cancelOrder(${o.id})">${t('Cancel order', 'إلغاء الطلب')}</button>` : ''}
    ${o.status === 'delivered' && !o.rating ? `<div class="card" style="margin-top:12px;text-align:center"><b>${t('How was it?', 'كيف كان الطلب؟')}</b><div style="font-size:28px;margin-top:6px">${[1, 2, 3, 4, 5].map(n => `<span style="cursor:pointer" onclick="rateOrder(${o.id},${n})">☆</span>`).join('')}</div></div>` : ''}`;
  const dest = [o.dropoff.lat, o.dropoff.lng]; const from = o.type === 'parcel' ? [o.pickup.lat, o.pickup.lng] : (o.store_lat ? [o.store_lat, o.store_lng] : null);
  trackMap = L.map('map').setView(dest, 13); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(trackMap);
  L.marker(dest).addTo(trackMap).bindTooltip('🏠'); if (from) L.marker(from).addTo(trackMap).bindTooltip(o.type === 'parcel' ? '📦' : '🏪');
  riderMarker = null; if (o.rider_lat && ['ready', 'picked_up'].includes(o.status)) riderMarker = L.circleMarker([o.rider_lat, o.rider_lng], { radius: 9, color: '#8A1538', fillColor: '#8A1538', fillOpacity: .9 }).addTo(trackMap);
  const pts = [dest, from, riderMarker && riderMarker.getLatLng()].filter(Boolean); if (pts.length > 1) trackMap.fitBounds(pts, { padding: [30, 30] });
}
async function cancelOrder(id) { if (!confirm(t('Cancel this order?', 'إلغاء هذا الطلب؟'))) return; try { await api(`/orders/${id}/status`, { method: 'POST', body: { status: 'cancelled' } }); toast(t('Order cancelled', 'تم إلغاء الطلب')); loadTrack(id); } catch (e) { toast(e.message, true); } }
async function rateOrder(id, n) { await api(`/orders/${id}/rate`, { method: 'POST', body: { rating: n } }); toast(t('Thanks for rating', 'شكراً لتقييمك')); loadTrack(id); }

// ---------- Account ----------
async function accountPage() {
  const me = await api('/auth/me');
  shell(`<div class="top"><h1 class="h1">${me.name || t('Your account', 'حسابك')}</h1><p class="muted">${me.phone}</p></div><div class="section">
    <div class="card row between"><span>👛 ${t('Wallet balance', 'رصيد المحفظة')}</span><b>${fmt(me.wallet)}</b></div>
    <div class="card row between" style="margin-top:10px"><span>📍 ${state.addr.line || t('Address', 'العنوان')}</span><button class="btn sm ghost" onclick="pickAddress()">${t('Change', 'تغيير')}</button></div>
    <div class="card row between" style="margin-top:10px"><span>🌐 ${t('Language', 'اللغة')}</span><button class="btn sm ghost" onclick="setLang(S.lang==='ar'?'en':'ar');accountPage()">${S.lang === 'ar' ? 'English' : 'العربية'}</button></div>
    <button class="btn ghost block" style="margin-top:20px" onclick="logout()">${t('Sign out', 'تسجيل الخروج')}</button></div>`, 'account');
}
boot();
</script>
</body></html>
